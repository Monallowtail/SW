<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あそぼう　Poincaré–Hopfの定理</title><link rel="stylesheet" href="style.css"><body>
<header><h1>あそぼう　Poincaré–Hopfの定理</h1><div class="surface-meta"><span class="surface">球面 <span class="math">S<sup>2</sup></span></span><span class="euler math">χ(<span class="math">S<sup>2</sup></span>) = 2</span></div><button id="reset">リセット</button></header>
<main><section class="view"><div class="caption"></div><canvas id="left" aria-label="固定された球面 X。ドラッグで自由に回転" tabindex="0"></canvas></section><section class="view"><div class="caption"><nav aria-label="Y の操作"><button id="deform" aria-pressed="true">変形</button><button id="rotate" aria-pressed="false">回転</button><button id="reverse">高さを反転</button></nav></div><canvas id="right" aria-label="曲面 Y。変形モードでは右上・右下・左上・左下を上下に引いて変形。左右の矢印キーで横に、上下の矢印キーで縦に変形" tabindex="0"></canvas></section></main>
<footer><div class="invariant" id="equation" aria-live="polite"></div><div class="regions" role="group" aria-label="変形する領域"><button id="patch0" aria-pressed="true">右上</button><button id="patch1" aria-pressed="false">右下</button><button id="patch2" aria-pressed="false">左上</button><button id="patch3" aria-pressed="false">左下</button></div><div class="tools"><button id="cancel" disabled>相殺</button><label class="amplitude"><span id="patch-name">右上</span> <input id="amplitude" aria-label="局所変形の強さ" type="range" min="-0.55" max="0.55" step="0.001" value="0"></label></div><div class="status"><span id="status" role="status">臨界点 <span class="math">2</span></span><div class="legend"><div><b class="orange">●</b><span>指数<span class="math">0</span>の臨界点（極小点）</span></div><div><b class="cyan">◆</b><span>指数<span class="math">1</span>の臨界点（鞍点）</span></div><div><b class="orange">■</b><span>指数<span class="math">2</span>の臨界点（極大点）</span></div></div></div></footer>
<script type="module" src="app.js"></script></body></html>
