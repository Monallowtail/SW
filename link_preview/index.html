<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>限定共有ページ</title>
<style>
body{margin:0;background:#f8f7f2;color:#253c3a;font-family:system-ui,sans-serif;line-height:1.8}.link-opening{max-width:620px;margin:12vh auto;padding:28px}.link-opening h1{font-size:24px}.link-opening p{color:#4c5d59}button{font:inherit}
</style>
</head>
<body>
<main class="link-opening"><h1>限定共有ページ</h1><p id="link-status" role="status">閲覧リンクを確認しています。</p></main>
<script>
'use strict';
(async () => {
  const status = document.getElementById('link-status');
  const storageName = 'mmvtp-link-preview/v1:' + location.pathname;
  const fragment = new URLSearchParams(location.hash.slice(1));
  const provided = fragment.has('key');
  let keyText = provided ? fragment.get('key') : null;
  if (!provided) {
    try { keyText = sessionStorage.getItem(storageName); } catch (_) { /* Storage can be disabled. */ }
  }
  function message(text) { status.textContent = text; }
  function removeKeyFragment() {
    if (!provided) return;
    const clean = new URL(location.href);
    const caseId = fragment.get('case');
    clean.hash = caseId && /^[A-Za-z0-9_-]{1,120}$/.test(caseId) ? caseId : '';
    history.replaceState(null, '', clean.href);
  }
  if (!keyText) {
    removeKeyFragment();
    message('共有用のリンクから開いてください。');
    return;
  }
  if (!/^[A-Za-z0-9_-]{43}$/.test(keyText)) {
    removeKeyFragment();
    message('このリンクではページを開けません。共有用のリンクを確認してください。');
    return;
  }
  if (!window.isSecureContext || !window.crypto?.subtle) {
    removeKeyFragment();
    message('このページをHTTPSのアドレスから開いてください。');
    return;
  }
  // Remove the secret fragment before any document request or UI initialization.
  removeKeyFragment();
  let plaintext;
  try {
    const encoded = keyText.replace(/-/g, '+').replace(/_/g, '/') + '=';
    const keyBytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    if (keyBytes.length !== 32) throw new Error('Invalid key');
    const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    const encrypted = await fetch(new URL('page.enc', location.href), {
      cache: 'no-store', credentials: 'omit', redirect: 'error', referrerPolicy: 'no-referrer'
    });
    if (!encrypted.ok) throw new Error('Encrypted page unavailable');
    const bytes = new Uint8Array(await encrypted.arrayBuffer());
    const header = new Uint8Array([77, 77, 86, 84, 80, 69, 78, 67, 1]);
    if (bytes.length < 37 || !header.every((value, index) => value === bytes[index])) throw new Error('Invalid page');
    const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes.slice(9, 21),
      additionalData: header, tagLength: 128}, key, bytes.slice(21));
    plaintext = new TextDecoder('utf-8', {fatal: true}).decode(decrypted);
    try { sessionStorage.setItem(storageName, keyText); } catch (_) { /* Sharing controls still work. */ }
    keyBytes.fill(0);
  } catch (_) {
    message('このリンクではページを開けません。共有用のリンクを確認してください。');
    return;
  }

  // Retaining this document's URL keeps the existing catalogue routing intact.
  document.open();
  document.write(plaintext);
  document.close();
  plaintext = null;

  const robots = document.createElement('meta');
  robots.name = 'robots'; robots.content = 'noindex,nofollow'; document.head.append(robots);

  function addSharingControl() {
    const main = document.querySelector('main');
    if (!main || document.getElementById('link-preview-sharing')) return;
    const bar = document.createElement('div');
    bar.id = 'link-preview-sharing';
    bar.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px';
    const button = document.createElement('button');
    button.type = 'button'; button.textContent = '共有・保存用リンク';
    const hint = document.createElement('span');
    hint.style.cssText = 'font-size:13px;color:#526561';
    hint.textContent = 'このリンクを知っている人が閲覧できます。';
    const feedback = document.createElement('span');
    feedback.setAttribute('role', 'status'); feedback.style.cssText = 'font-size:13px';
    button.addEventListener('click', () => {
      const sharing = new URL(location.href);
      const existingFragment = new URLSearchParams(sharing.hash.slice(1));
      const caseId = existingFragment.has('key') ? existingFragment.get('case') : sharing.hash.slice(1);
      const parts = new URLSearchParams({key: keyText});
      if (window.MMVTpPreviewData?.catalog.some(record => record.id === caseId)) parts.set('case', caseId);
      sharing.hash = parts.toString();
      const sharingURL = sharing.href;
      history.replaceState(null, '', sharingURL);
      feedback.textContent = 'アドレス欄のリンクを保存・共有できます。';
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(sharingURL).then(() => {
          feedback.textContent = '共有・保存用リンクをコピーしました。';
        }).catch(() => { /* The address bar remains usable. */ });
      }
    });
    bar.append(button, hint, feedback); main.prepend(bar);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addSharingControl, {once: true});
  else addSharingControl();
})().catch(() => {
  const status = document.getElementById('link-status');
  if (status) status.textContent = 'ページを開けませんでした。共有用のリンクを確認してください。';
});
</script>
</body>
</html>
