<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="曲面のはめ込みを回転し、平面への射影のカスプと射影化回転数を調べる数学実験。"><title>輪郭線とあそぼう</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>輪郭線とあそぼう</h1><div class="surface-meta"><select id="surface-select" aria-label="曲面を選ぶ"><option value="sphere">球面</option><option value="torus">トーラス</option><option value="genus2">2人乗りの浮き輪</option><option value="rp2">射影平面：ボーイ曲面</option><option value="roman">射影平面：ローマン曲面</option><option value="klein">クラインの壺：壺型</option><option value="klein8">クラインの壺：8の字型</option></select><span id="euler" class="euler math">χ(S<sup>2</sup>) = 2</span></div><button id="reset">リセット</button></header>
<main><section class="view"><div class="caption"><span class="view-label" id="surface-label">球面とスクリーン</span><nav aria-label="曲面の操作"><button id="deform" aria-pressed="true">変形</button><button id="rotate" aria-pressed="false">回転</button></nav></div><canvas id="surface" tabindex="0" aria-label="球面。変形モードで4箇所を上下に引いて変形。回転モードで射影方向を変更。"></canvas></section><section class="view"><div class="caption"><span class="view-label">スクリーン</span></div><canvas id="screen" tabindex="0" aria-label="球面の平面への射影。ドラッグまたは矢印キーで選択点を移動。"></canvas><span class="canvas-hint" id="preimages">逆像 2個</span></section></main>
<footer><div id="cusp-equation" class="invariant" aria-live="polite"></div><div id="equation" class="invariant" aria-live="polite"></div><div class="result-detail"><div id="component-results" aria-label="成分別の射影化回転数"></div></div><div id="regions" class="regions" role="group" aria-label="変形する領域"><button id="patch0" aria-pressed="true">右上</button><button id="patch1" aria-pressed="false">右下</button><button id="patch2" aria-pressed="false">左上</button><button id="patch3" aria-pressed="false">左下</button></div><div id="deformation-tools" class="tools"><label class="amplitude"><input id="amplitude" type="range" min="-.55" max=".55" step=".001" value="0" aria-label="局所変形の強さ"></label></div><span id="surface-note"></span><span id="status" role="status"></span>
</footer><script type="module" src="app.js"></script></body></html>
